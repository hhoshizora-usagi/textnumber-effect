<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字と数字のエフェクト 深掘り｜8種</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#07172a;--accent:#e8862f;--ink:#ecf3fb;--sub:#9db2c8;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;background:radial-gradient(circle at 50% -12%,#123352 0%,var(--bg) 46%,#040e19 100%);color:var(--ink);min-height:100vh;padding:46px 16px 80px}
.wrap{max-width:1120px;margin:0 auto}
header{text-align:center}
h1{font-size:clamp(22px,3.4vw,34px);font-weight:800;letter-spacing:.02em}
h1 small{display:block;font-size:.4em;letter-spacing:.34em;color:var(--accent);margin-top:9px}
header p{margin-top:12px;color:var(--sub);font-size:13.5px}
.panel{max-width:760px;margin:24px auto 40px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.panel input{flex:1;min-width:230px;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-size:15px;outline:none}
.panel input:focus{border-color:rgba(232,134,47,.7)}
.panel button{padding:11px 18px;border-radius:12px;border:1px solid rgba(232,134,47,.45);background:rgba(232,134,47,.15);color:#ffcb8e;font-size:13.5px;cursor:pointer}
.panel button:hover{background:rgba(232,134,47,.27)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}
.card{background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:18px;padding:18px;overflow:hidden}
.stage{height:118px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);margin-bottom:13px;overflow:hidden;position:relative}
.big{font-size:clamp(19px,3.6vw,32px);font-weight:800;letter-spacing:.03em;white-space:nowrap}
.head{display:flex;align-items:center;gap:8px}
.no{font-size:11px;color:var(--accent);border:1px solid rgba(232,134,47,.5);border-radius:6px;padding:1px 7px}
h2{font-size:15.5px}
h2 small{font-size:9.5px;color:var(--sub);letter-spacing:.16em;margin-left:6px}
.card p{color:var(--sub);font-size:12.5px;line-height:1.75;margin-top:6px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
code{font-size:11.5px;color:#8fd0ff;background:rgba(143,208,255,.08);padding:3px 8px;border-radius:6px}
.replay{font-size:11.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer}
.replay:hover{border-color:rgba(232,134,47,.7);color:#ffcb8e}
footer{text-align:center;margin-top:48px;color:#52708d;font-size:12px}
footer a{color:#8fd0ff;text-decoration:none}
.ch{display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>文字と数字のエフェクト 深掘り<small>DEEP DIVE 08</small></h1>
    <p>textnumber-effect の続き。上の欄に入れた文章が、そのまま8つの演出で動きます。</p>
  </header>
  <div class="panel">
    <input id="src" value="REALIZE 137kWh" aria-label="表示する文章">
    <button id="apply">この文章で動かす</button>
    <button id="allBtn">全部もう一回</button>
  </div>
  <div class="grid" id="grid"></div>
  <footer>深掘り編 8種 · <a href="https://hhoshizora-usagi.github.io/effect-hub/">Effect Hub へもどる</a></footer>
</div>
<script>
(function(){
  var state={text:'REALIZE 137kWh'};
  var LAT='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var KANA='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン';
  var DIG='0123456789';
  function setFor(c){ if(/[0-9]/.test(c))return DIG; if(/[A-Za-z]/.test(c))return LAT; return KANA; }
  function rnd(s){ return s[Math.floor(Math.random()*s.length)]; }
  function chars(s){ return Array.from(s); }
  function esc(c){ return c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function nb(c){ return c===' ' ? '\u00a0' : esc(c); }
  function reset(el){ el.style.cssText=''; el.innerHTML=''; }

  var CARDS=[
    {id:'countup',no:'01',name:'カウントアップ',en:'COUNT UP',desc:'数字が0から目標値までなめらかに数え上がる演出。単位つきの数値に向いています。',fx:'countup()'},
    {id:'odometer',no:'02',name:'オドメーター',en:'ODOMETER',desc:'距離計のように、数字の列がくるくる回って止まる演出。',fx:'odometer()'},
    {id:'typewriter',no:'03',name:'タイプライター',en:'TYPEWRITER',desc:'1文字ずつ打ち込まれて、カーソルが点滅する演出。',fx:'typewriter()'},
    {id:'wave',no:'04',name:'ウェーブ',en:'WAVE',desc:'文字が波のようにゆらゆら上下する演出。',fx:'wave()'},
    {id:'gradient',no:'05',name:'グラデーション流れ',en:'GRADIENT FLOW',desc:'虹色のグラデーションが文字の上を流れていく演出。',fx:'gradient()'},
    {id:'slot',no:'06',name:'スロット確定',en:'SLOT',desc:'1文字ずつ回転して、左から順に文字が確定していく演出。',fx:'slot()'},
    {id:'karaoke',no:'07',name:'カラオケ',en:'KARAOKE',desc:'歌詞のように、色が左から右へ塗られていく演出。',fx:'karaoke()'},
    {id:'scatter',no:'08',name:'ばらけて再集合',en:'SCATTER',desc:'文字がいったん飛び散って、また元の位置に集まる演出。',fx:'scatter()'}
  ];

  function build(el,text){
    el.innerHTML='';
    var sp=[];
    chars(text).forEach(function(c){
      var s=document.createElement('span');
      s.className='ch'; s.innerHTML=nb(c);
      el.appendChild(s); sp.push(s);
    });
    return sp;
  }

  function countup(el){
    var src=chars(state.text);
    var hasDigit=src.some(function(c){return /[0-9]/.test(c)});
    var t0=performance.now(), dur=1300;
    if(hasDigit){
      var sp=build(el,state.text);
      (function frame(now){
        var p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
        src.forEach(function(c,i){ if(/[0-9]/.test(c)) sp[i].textContent=String(Math.round(parseInt(c,10)*e)); });
        if(p<1) requestAnimationFrame(frame);
      })(t0);
    } else {
      var d=document.createElement('span'); d.className='ch'; el.appendChild(d);
      (function frame(now){
        var p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
        d.textContent=String(Math.round(137*e));
        if(p<1) requestAnimationFrame(frame);
      })(t0);
    }
  }

  function odometer(el){
    var cols=[];
    chars(state.text).forEach(function(c){
      if(/[0-9]/.test(c)){
        var w=document.createElement('span');
        w.className='ch'; w.style.display='inline-block';
        w.style.height='1.25em'; w.style.overflow='hidden'; w.style.verticalAlign='top';
        var strip=document.createElement('span');
        strip.style.display='block'; strip.style.lineHeight='1.25em';
        strip.textContent='0123456789'+c;
        w.appendChild(strip); el.appendChild(w);
        cols.push({strip:strip,target:parseInt(c,10)});
      } else {
        var s=document.createElement('span'); s.className='ch'; s.innerHTML=nb(c); el.appendChild(s);
      }
    });
    var t0=performance.now(), dur=1500;
    (function frame(now){
      var p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      cols.forEach(function(col){ col.strip.style.transform='translateY('+(-(col.target*e)*1.25).toFixed(3)+'em)'; });
      if(p<1) requestAnimationFrame(frame);
    })(t0);
  }

  function typewriter(el){
    var sp=build(el,state.text);
    sp.forEach(function(s){s.style.opacity='0'});
    var caret=document.createElement('span'); caret.className='ch'; caret.textContent='|'; caret.style.color='#ffcb8e';
    el.appendChild(caret);
    var i=0;
    var ty=setInterval(function(){
      if(i>=sp.length){ clearInterval(ty); return; }
      sp[i].style.opacity='1'; i++;
    },75);
    var bk=setInterval(function(){ caret.style.opacity = caret.style.opacity==='0' ? '1' : '0'; },420);
    setTimeout(function(){ clearInterval(bk); caret.remove(); }, sp.length*75+1600);
  }

  function wave(el){
    var sp=build(el,state.text);
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var t0=performance.now();
    (function frame(now){
      var t=(now-t0)/1000;
      if(t>6){ sp.forEach(function(s){s.style.transform=''}); return; }
      sp.forEach(function(s,i){ s.style.transform='translateY('+(Math.sin(t*2.4+i*0.55)*6).toFixed(2)+'px)'; });
      requestAnimationFrame(frame);
    })(t0);
  }

  function gradient(el){
    el.textContent=state.text;
    el.style.backgroundImage='linear-gradient(90deg,#ff9ecb,#ffd479,#7dd3fc,#a78bfa,#ff9ecb)';
    el.style.backgroundSize='300% 100%';
    el.style.webkitBackgroundClip='text';
    el.style.backgroundClip='text';
    el.style.webkitTextFillColor='transparent';
    el.style.color='transparent';
    var t0=performance.now();
    (function frame(now){
      var t=now-t0;
      if(t>9000) return;
      el.style.backgroundPosition=(((t/2600)%1)*100).toFixed(1)+'% 0';
      requestAnimationFrame(frame);
    })(t0);
  }

  function slot(el){
    var sp=build(el,state.text), src=chars(state.text);
    var t0=performance.now(), dur=1700;
    (function frame(now){
      var p=Math.min(1,(now-t0)/dur);
      src.forEach(function(c,i){
        var lock=(i+1)/src.length*0.88;
        if(p>lock){ sp[i].innerHTML=nb(c); sp[i].style.color=''; }
        else { sp[i].textContent=rnd(setFor(c)); sp[i].style.color='rgba(236,243,251,.42)'; }
      });
      if(p<1) requestAnimationFrame(frame);
      else src.forEach(function(c,i){ sp[i].innerHTML=nb(c); sp[i].style.color=''; });
    })(t0);
  }

  function karaoke(el){
    var sp=build(el,state.text);
    sp.forEach(function(s){ s.style.color='rgba(236,243,251,.28)'; });
    var t0=performance.now(), dur=2200;
    (function frame(now){
      var p=Math.min(1,(now-t0)/dur);
      var upto=Math.floor(p*sp.length);
      sp.forEach(function(s,i){ s.style.color = i<upto ? '#ffcb8e' : 'rgba(236,243,251,.28)'; });
      if(p<1) requestAnimationFrame(frame);
      else sp.forEach(function(s){s.style.color='#ffcb8e'});
    })(t0);
  }

  function scatter(el){
    var sp=build(el,state.text);
    var dirs=sp.map(function(){ return {x:(Math.random()-.5)*260, y:(Math.random()-.5)*140, r:(Math.random()-.5)*160}; });
    var t0=performance.now(), dur=1500;
    (function frame(now){
      var p=Math.min(1,(now-t0)/dur);
      var out = p<0.45 ? (p/0.45) : 1-((p-0.45)/0.55);
      var f = out*out;
      sp.forEach(function(s,i){
        var d=dirs[i];
        s.style.transform='translate('+(d.x*f).toFixed(1)+'px,'+(d.y*f).toFixed(1)+'px) rotate('+(d.r*f).toFixed(1)+'deg)';
        s.style.opacity=String((1-f*0.65).toFixed(3));
      });
      if(p<1) requestAnimationFrame(frame);
      else sp.forEach(function(s){ s.style.transform=''; s.style.opacity='1'; });
    })(t0);
  }

  var runners={countup:countup,odometer:odometer,typewriter:typewriter,wave:wave,gradient:gradient,slot:slot,karaoke:karaoke,scatter:scatter};

  function playAll(){
    CARDS.forEach(function(c){
      var el=document.getElementById('fx-'+c.id);
      if(!el) return;
      reset(el);
      runners[c.id](el);
    });
  }

  function render(){
    var grid=document.getElementById('grid');
    grid.innerHTML='';
    CARDS.forEach(function(c){
      var art=document.createElement('article');
      art.className='card';
      art.innerHTML='<div class="stage"><span class="big" id="fx-'+c.id+'"></span></div>'+
        '<div class="head"><span class="no">'+c.no+'</span><h2>'+c.name+'<small>'+c.en+'</small></h2></div>'+
        '<p>'+c.desc+'</p>'+
        '<div class="foot"><code>'+c.fx+'</code><button class="replay" data-fx="'+c.id+'">もう一回 ↻</button></div>';
      grid.appendChild(art);
    });
    grid.querySelectorAll('.replay').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-fx');
        var el=document.getElementById('fx-'+id);
        reset(el); runners[id](el);
      });
    });
  }

  document.getElementById('apply').addEventListener('click',function(){
    var v=document.getElementById('src').value;
    state.text = v && v.length ? v : 'REALIZE 137kWh';
    playAll();
  });
  document.getElementById('allBtn').addEventListener('click',playAll);

  render();
  playAll();
})();
</script>
</body>
</html>
